const todayStr = () => {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
};

const formatDate = (iso) => {
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
};

const uid = (prefix) => `${prefix}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;

const repValues = (s) => {
  if (s.split) {
    const vals = [];
    const l = parseFloat(s.left);
    const r = parseFloat(s.right);
    if (!isNaN(l)) vals.push(l);
    if (!isNaN(r)) vals.push(r);
    return vals;
  }
  const w = parseFloat(s.weight);
  return isNaN(w) ? [] : [w];
};

const formatRep = (s) => {
  const suffix = s.kind === "DS" ? " DS" : "";
  const repsPart = s.reps ? ` x${s.reps}` : "";
  if (s.split) {
    return `L${s.left || "-"} / R${s.right || "-"}${suffix}${repsPart}`;
  }
  return `${s.weight}${suffix}${repsPart}`;
};

async function storageGet(key) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  } catch (e) {
    return null;
  }
}
async function storageSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.error("storage set failed", key, e);
  }
}
async function storageDelete(key) {
  try {
    localStorage.removeItem(key);
  } catch (e) {}
}

const sortExercises = (list, getStats) =>
  list.slice().sort((a, b) => {
    const sa = getStats ? getStats(a.id) : {};
    const sb = getStats ? getStats(b.id) : {};
    const scoreA = (sa.last ? 2 : 0) + (sa.prStraight !== null && sa.prStraight !== undefined ? 1 : 0) + (sa.prDS !== null && sa.prDS !== undefined ? 1 : 0);
    const scoreB = (sb.last ? 2 : 0) + (sb.prStraight !== null && sb.prStraight !== undefined ? 1 : 0) + (sb.prDS !== null && sb.prDS !== undefined ? 1 : 0);
    if (scoreB !== scoreA) return scoreB - scoreA;
    return a.name.localeCompare(b.name);
  });

            exercise={exerciseById[detailExerciseId]}
            exercises={exercises}
            setExercises={persistExercises}
            history={history[detailExerciseId] || []}

            logs={logs}
            setLogs={persistLogs}
            programs={programs}
            setPrograms={persistPrograms}
            onBack={() => setTab("library")}

function NavButton({ icon: Icon, label, active, onClick }) {
  return (
    <button onClick={onClick} className={`flex flex-col items-center gap-0.5 px-3 py-1 rounded-lg ${active ? "text-amber-500" : "text-neutral-500"}`}>
      <Icon size={20} strokeWidth={active ? 2.2 : 1.8} />
      <span className="text-[11px]">{label}</span>
    </button>
  );
}

    neutral: "bg-neutral-800 text-neutral-300",
    amber: "bg-amber-900/40 text-amber-400",
    teal: "bg-teal-900/40 text-teal-400",
    red: "bg-red-900/40 text-red-400",
    purple: "bg-purple-900/40 text-purple-400",
    alt: "bg-sky-900/40 text-sky-400",
    orange: "bg-orange-900/40 text-orange-400",
  };
  return <span className={`text-[11px] px-2 py-0.5 rounded-md ${tones[tone]}`}>{children}</span>;
}

function TodayView({ exercises, setExercises, programs, draft, setDraft, logs, setLogs, getStats, exerciseById }) {
  const [pickerOpen, setPickerOpen] = useState(!draft);
  const [selectedPrograms, setSelectedPrograms] = useState([]);
  const [swapTarget, setSwapTarget] = useState(null);
  const [confirmDiscard, setConfirmDiscard] = useState(false);
  const [openKeys, setOpenKeys] = useState({});
  const toggleCollapsed = (key) => setOpenKeys((prev) => ({ ...prev, [key]: !prev[key] }));
  const cardRefs = useRef({});

  const jumpTo = (key) => {
    cardRefs.current[key]?.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const clearNextFlag = (exerciseId) => {
    setExercises(exercises.map((e) => (e.id === exerciseId ? { ...e, nextTimeNote: "" } : e)));
  };

  const setNextFlag = (exerciseId) => {
    setExercises(exercises.map((e) => (e.id === exerciseId ? { ...e, nextTimeNote: "Increase weight" } : e)));
  };

  const activePrograms = programs.filter((p) => !p.archived);

  const presetSets = (exerciseId) => {
    const stats = getStats(exerciseId);
    if (!stats.last) return [];
    return stats.last.sets.map((s) => ({
      weight: s.split ? "" : s.weight !== undefined ? String(s.weight) : "",
      kind: s.kind || "straight",
      split: !!s.split,
      left: s.split && s.left !== undefined ? String(s.left) : "",
      right: s.split && s.right !== undefined ? String(s.right) : "",
      reps: s.reps || "",
      confirmed: false,
    }));
  };

  const beginSession = (extraExerciseIds = []) => {
    const chosen = programs.filter((p) => selectedPrograms.includes(p.id));
    const entries = [];
    const seen = new Set();
    chosen.forEach((p) => {
      p.exerciseIds.forEach((eid) => {
        if (seen.has(eid)) return;
        seen.add(eid);
        entries.push({ key: uid("en"), exerciseId: eid, plannedExerciseId: null, programId: p.id, sets: presetSets(eid) });
      });
    });
    extraExerciseIds.forEach((eid) => {
      if (seen.has(eid)) return;
      seen.add(eid);
      entries.push({ key: uid("en"), exerciseId: eid, plannedExerciseId: null, programId: null, sets: presetSets(eid) });
    });
    setDraft({ date: todayStr(), programIds: selectedPrograms, entries });
    setPickerOpen(false);
  };

  const updateEntry = (key, updater) => {
    const next = { ...draft, entries: draft.entries.map((e) => (e.key === key ? updater(e) : e)) };
    setDraft(next);
  };

  const removeEntry = (key) => {
    setDraft({ ...draft, entries: draft.entries.filter((e) => e.key !== key) });
  };

  const addSet = (key) => {
    updateEntry(key, (e) => {
      const prev = e.sets[e.sets.length - 1];
      const next = prev
        ? { weight: prev.weight, kind: prev.kind, split: prev.split, left: prev.left, right: prev.right, reps: prev.reps, confirmed: false }
        : { weight: "", kind: "straight", split: false, left: "", right: "", reps: "", confirmed: false };
      return { ...e, sets: [...e.sets, next] };
    });
  };
  const updateSet = (key, idx, field, value) => {
    updateEntry(key, (e) => ({
      ...e,
      sets: e.sets.map((s, i) => (i === idx ? { ...s, [field]: value, confirmed: field === "confirmed" ? value : false } : s)),
    }));
  };
  const removeSet = (key, idx) => {
    updateEntry(key, (e) => ({ ...e, sets: e.sets.filter((_, i) => i !== idx) }));
  };

  const toggleSplit = (key, idx) => {
    updateEntry(key, (e) => ({
      ...e,
      sets: e.sets.map((s, i) => {
        if (i !== idx) return s;
        if (!s.split) {
          // turning split ON: carry the single weight into both sides as a starting point
          return { ...s, split: true, left: s.weight || "", right: s.weight || "", confirmed: false };
        }
        // turning split OFF: carry the left value forward so nothing typed is lost
        return { ...s, split: false, weight: s.left || s.right || "", left: "", right: "", confirmed: false };
      }),
    }));
  };

  const confirmRow = (key, idx) => {
    updateEntry(key, (e) => ({
      ...e,
      sets: e.sets.map((s, i) => {
        if (i !== idx) return s;
        if (s.confirmed) return { ...s, confirmed: false };
        return s.split ? { ...s, confirmed: true, weight: "" } : { ...s, confirmed: true, left: "", right: "" };
      }),
    }));
  };

  const addAdHocExercise = (exerciseId) => {
    if (!draft) {
      setDraft({ date: todayStr(), programIds: [], entries: [{ key: uid("en"), exerciseId, plannedExerciseId: null, programId: null, sets: presetSets(exerciseId) }] });
      setPickerOpen(false);
      return;
    }
    setDraft({ ...draft, entries: [...draft.entries, { key: uid("en"), exerciseId, plannedExerciseId: null, programId: null, sets: presetSets(exerciseId) }] });
  };

  const doSwap = (key, newExerciseId) => {
    updateEntry(key, (e) => ({
      ...e,
      plannedExerciseId: e.plannedExerciseId || e.exerciseId,
      exerciseId: newExerciseId,
      sets: presetSets(newExerciseId),
    }));
    setSwapTarget(null);
  };

  const finishSession = () => {
    const newLogs = [];
    draft.entries.forEach((e) => {
      const validSets = e.sets.filter((s) => (s.split ? s.left !== "" || s.right !== "" : s.weight !== "" && s.weight !== null));
      const hasNote = e.note && e.note.trim() !== "";
      if (validSets.length === 0 && !hasNote) return;
      newLogs.push({
        id: uid("log"),
        date: draft.date,
        exerciseId: e.exerciseId,
        plannedExerciseId: e.plannedExerciseId,
        programIds: draft.programIds,
        sets: validSets.map((s) =>
          s.split
            ? { split: true, left: s.left, right: s.right, kind: s.kind }
            : { weight: parseFloat(s.weight), kind: s.kind, reps: s.reps }
        ),
        note: hasNote ? e.note.trim() : "",
        ts: Date.now(),
      });
    });
    setLogs([...logs, ...newLogs]);
    setDraft(null);
    setPickerOpen(true);
    setSelectedPrograms([]);
  };

  const discardSession = () => {
    setDraft(null);
    setPickerOpen(true);
    setSelectedPrograms([]);
    setConfirmDiscard(false);
  };

  if (pickerOpen || !draft) {
    return (
      <div className="px-4 py-4 space-y-4">
        <p className="text-sm text-neutral-400">Pick one or more workouts for today. You can add extra exercises once you're in.</p>
        <div className="space-y-2">
          {activePrograms.map((p) => {
            const isSel = selectedPrograms.includes(p.id);
            return (
              <button
                key={p.id}
                onClick={() => setSelectedPrograms((s) => (isSel ? s.filter((x) => x !== p.id) : [...s, p.id]))}
                className={`w-full flex items-center justify-between px-4 py-3 rounded-xl border text-left ${
                  isSel ? "border-amber-500 bg-amber-900/10" : "border-neutral-800 bg-neutral-900"
                }`}
              >
                <div>
                  <div className="font-medium text-sm">{p.name}</div>
                  <div className="text-xs text-neutral-500">{p.exerciseIds.length} exercises</div>
                </div>
                {isSel ? <Check size={18} className="text-amber-500" /> : <ChevronRight size={18} className="text-neutral-600" />}
              </button>
            );
          })}
          {activePrograms.length === 0 && <p className="text-sm text-neutral-500">No workouts yet. Create one in the Workouts tab.</p>}
        </div>
        <button
          disabled={selectedPrograms.length === 0}
          onClick={() => beginSession()}
          className={`w-full py-3 rounded-xl font-medium text-sm ${
            selectedPrograms.length === 0 ? "bg-neutral-800 text-neutral-600" : "bg-amber-500 text-neutral-950"
          }`}
        >
          Start session {selectedPrograms.length > 0 ? `(${selectedPrograms.length} workout${selectedPrograms.length > 1 ? "s" : ""})` : ""}
        </button>
        {draft && (
          <button onClick={() => setPickerOpen(false)} className="w-full py-2.5 rounded-xl text-sm text-neutral-400 border border-neutral-800">
            Back to in-progress session
          </button>
        )}
      </div>
    );
  }

  return (
    <div className="px-4 py-4 space-y-3">
      <div className="flex items-center justify-between">
        <div className="text-xs text-neutral-500">
          {draft.programIds.map((pid) => programs.find((p) => p.id === pid)?.name).filter(Boolean).join(" + ") || "Freestyle session"}
        </div>
        <AddExercisePicker exercises={exercises} onPick={addAdHocExercise} label="Add exercise" getStats={getStats} />
      </div>

      {draft.entries.length > 1 && (
        <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-4 px-4">
          {draft.entries.map((entry) => {
            const ex = exerciseById[entry.exerciseId];
            if (!ex) return null;
            const hasData = entry.sets.some((s) => (s.split ? s.left !== "" || s.right !== "" : s.weight !== "" && s.weight !== null));
            return (
              <button
                key={entry.key}
                onClick={() => jumpTo(entry.key)}
                className={`shrink-0 text-xs px-2.5 py-1.5 rounded-lg border whitespace-nowrap flex items-center gap-1 ${
                  hasData ? "border-teal-700 bg-teal-900/20 text-teal-400" : "border-neutral-700 bg-neutral-900 text-neutral-400"
                }`}
              >
                {hasData && <Check size={11} />}
                {ex.name}
              </button>
            );
          })}
        </div>
      )}

      {draft.entries.map((entry) => {
        const ex = exerciseById[entry.exerciseId];
        if (!ex) return null;
        const stats = getStats(entry.exerciseId);
        return (
          <div key={entry.key} ref={(el) => (cardRefs.current[entry.key] = el)} className="bg-neutral-900 border border-neutral-800 rounded-xl p-3 space-y-2">
            {ex.nextTimeNote && (
              <button
                onClick={() => clearNextFlag(ex.id)}
                className="w-full flex items-center justify-between gap-2 bg-amber-900/30 border border-amber-700/50 text-amber-300 text-xs px-2.5 py-1.5 rounded-lg text-left"
              >
                <span>⚡ {ex.nextTimeNote}</span>
                <span className="text-[10px] text-amber-500 shrink-0">Tap to clear</span>
              </button>
            )}
            <div className="flex items-start justify-between gap-2">
              <div>
                <div className="flex items-center gap-1.5">
                  <div className="font-medium text-sm">{ex.name}</div>
                  {ex.suggested && <Badge tone="purple">Suggested</Badge>}
                </div>
                <div className="text-xs text-neutral-500">
                  {ex.machine ? `${ex.machine} · ` : ""}
                  {ex.defaultSets && ex.defaultReps ? `${ex.defaultSets} x ${ex.defaultReps}` : ""}
                </div>
                {entry.plannedExerciseId && (
                  <div className="text-[11px] text-teal-500 mt-0.5">Swapped in for {exerciseById[entry.plannedExerciseId]?.name}</div>
                )}
                {(ex.supersetWith || []).length > 0 && (
                  <div className="text-[11px] text-orange-400 mt-0.5">
                    Superset with: {(ex.supersetWith || []).map((id) => exerciseById[id]?.name).filter(Boolean).join(", ")}
                  </div>
                )}
              </div>
              <div className="flex gap-1 shrink-0">
                <button
                  onClick={() => toggleCollapsed(entry.key)}
                  className="p-1.5 rounded-lg bg-neutral-800 text-neutral-400"
                  aria-label={openKeys[entry.key] ? "Minimize exercise" : "Expand exercise"}
                >
                  {openKeys[entry.key] ? <ChevronUp size={15} /> : <ChevronDown size={15} />}
                </button>
                <button onClick={() => setSwapTarget(entry.key)} className="p-1.5 rounded-lg bg-neutral-800 text-neutral-400" aria-label="Swap exercise">
                  <ArrowLeftRight size={15} />
                </button>
                <button onClick={() => removeEntry(entry.key)} className="p-1.5 rounded-lg bg-neutral-800 text-neutral-400" aria-label="Remove exercise">
                  <X size={15} />
                </button>
              </div>
            </div>

            <div className="flex gap-2 flex-wrap">
              {stats.prStraight !== null && <Badge tone="amber">PR {stats.prStraight}</Badge>}
              {stats.prDS !== null && <Badge tone="amber">PR DS {stats.prDS}</Badge>}
              {stats.last ? (
                <Badge tone="teal">
                  Last {stats.last.sets.map((s) => formatRep(s)).join(", ")} on {formatDate(stats.last.date)}
                </Badge>
              ) : ex.refNote ? (
                <Badge>Sheet ref: {ex.refNote}</Badge>
              ) : null}
            </div>

            {openKeys[entry.key] ? (
            <React.Fragment>
            {ex.warmupScheme && (
              <WarmupBlock ex={ex} entry={entry} stats={stats} updateEntry={updateEntry} />
            )}

            <div className="space-y-1.5">
              {entry.sets.map((s, i) => (
                <div key={i} className={`rounded-lg p-1.5 ${s.confirmed ? "bg-teal-950/30 border border-teal-800/60" : ""}`}>
                  <div className="flex items-center gap-1.5">
                    <span className="text-xs text-neutral-500 w-4 shrink-0">{i + 1}</span>
                    {s.split ? (
                      <div className="flex gap-1">
                        <input
                          type="number"
                          inputMode="decimal"
                          placeholder="L"
                          value={s.left}
                          onChange={(ev) => updateSet(entry.key, i, "left", ev.target.value)}
                          className={`w-16 rounded-lg px-2 py-1.5 text-sm border ${s.confirmed ? "bg-teal-950/40 border-teal-800 text-teal-100" : "bg-neutral-800 border-neutral-700"}`}
                        />
                        <input
                          type="number"
                          inputMode="decimal"
                          placeholder="R"
                          value={s.right}
                          onChange={(ev) => updateSet(entry.key, i, "right", ev.target.value)}
                          className={`w-16 rounded-lg px-2 py-1.5 text-sm border ${s.confirmed ? "bg-teal-950/40 border-teal-800 text-teal-100" : "bg-neutral-800 border-neutral-700"}`}
                        />
                      </div>
                    ) : (
                      <input
                        type="number"
                        inputMode="decimal"
                        placeholder="Weight"
                        value={s.weight}
                        onChange={(ev) => updateSet(entry.key, i, "weight", ev.target.value)}
                        maxLength={7}
                        className={`w-20 rounded-lg px-2 py-1.5 text-sm border ${s.confirmed ? "bg-teal-950/40 border-teal-800 text-teal-100" : "bg-neutral-800 border-neutral-700"}`}
                      />
                    )}
                    <input
                      type="number"
                      inputMode="numeric"
                      placeholder="Reps"
                      value={s.reps}
                      onChange={(ev) => updateSet(entry.key, i, "reps", ev.target.value)}
                      className={`w-14 rounded-lg px-1.5 py-1.5 text-sm border text-center ${s.confirmed ? "bg-teal-950/40 border-teal-800 text-teal-100" : "bg-neutral-800 border-neutral-700"}`}
                    />
                  </div>
                  <div className="flex items-center gap-1.5 mt-1 pl-6">
                    <button
                      onClick={() => toggleSplit(entry.key, i)}
                      aria-label="Toggle left/right weight"
                      className={`text-[10px] px-1.5 py-1.5 rounded-lg border shrink-0 ${s.split ? "border-teal-500 text-teal-500" : "border-neutral-700 text-neutral-500"}`}
                    >
                      L/R
                    </button>
                    <div className="flex bg-neutral-800 rounded-lg border border-neutral-700 overflow-hidden text-xs shrink-0">
                      <button
                        onClick={() => updateSet(entry.key, i, "kind", "straight")}
                        className={`px-2 py-1.5 ${s.kind === "straight" ? "bg-amber-500 text-neutral-950" : "text-neutral-400"}`}
                      >
                        S
                      </button>
                      <button
                        onClick={() => updateSet(entry.key, i, "kind", "DS")}
                        className={`px-2 py-1.5 ${s.kind === "DS" ? "bg-amber-500 text-neutral-950" : "text-neutral-400"}`}
                      >
                        DS
                      </button>
                    </div>
                    <div className="flex-1" />
                    <button
                      onClick={() => confirmRow(entry.key, i)}
                      aria-label={s.confirmed ? "Confirmed" : "Confirm this row"}
                      className={`p-1.5 rounded-lg shrink-0 ${s.confirmed ? "text-teal-400" : "text-neutral-600"}`}
                    >
                      <Check size={16} />
                    </button>
                    <button onClick={() => removeSet(entry.key, i)} className="text-neutral-600 p-1.5 shrink-0" aria-label="Remove rep">
                      <X size={14} />
                    </button>
                  </div>
                </div>
              ))}
            </div>
            <p className="text-[11px] text-neutral-600 pl-6 -mt-1">
              Reps defaults to blank (assume you hit the target) — fill it in if you came up short. Tap L/R to log a different weight per arm or leg. Tap ✓ to lock in a row — editing it again unlocks it.
            </p>
            <div className="flex items-center justify-between pt-1">
              <button onClick={() => addSet(entry.key)} className="text-xs text-amber-500 flex items-center gap-1">
                <Plus size={13} /> Add rep
              </button>
              {!ex.nextTimeNote && (
                <button onClick={() => setNextFlag(ex.id)} className="text-xs text-neutral-500 flex items-center gap-1">
                  ⚡ Increase next time
                </button>
              )}
            </div>
            </React.Fragment>
            ) : null}

            {swapTarget === entry.key && (
              <SwapPanel
                exercises={exercises}
                currentExercise={ex}
                onPick={(newId) => doSwap(entry.key, newId)}
                onClose={() => setSwapTarget(null)}
                getStats={getStats}
              />
            )}

            <textarea
              value={entry.note || ""}
              onChange={(ev) => updateEntry(entry.key, (e) => ({ ...e, note: ev.target.value }))}
              placeholder="Notes for today (form cue, pain, machine setting...)"
              rows={1}
              className="w-full bg-neutral-800 rounded-lg px-2.5 py-1.5 text-xs border border-neutral-700 text-neutral-300 placeholder-neutral-600 resize-none"
            />
          </div>
        );
      })}

      {draft.entries.length === 0 && <p className="text-sm text-neutral-500 text-center py-6">No exercises yet. Add one above.</p>}

      <div className="flex gap-2 pt-2">
        {confirmDiscard ? (
          <>
            <span className="flex-1 text-xs text-red-400 flex items-center justify-center px-2">Discard this whole session?</span>
            <button onClick={() => setConfirmDiscard(false)} className="flex-1 py-3 rounded-xl border border-neutral-800 text-neutral-400 text-sm">
              Cancel
            </button>
            <button onClick={discardSession} className="flex-1 py-3 rounded-xl bg-red-600 text-white text-sm font-medium">
              Yes, discard
            </button>
          </>
        ) : (
          <>
            <button onClick={() => setConfirmDiscard(true)} className="flex-1 py-3 rounded-xl border border-neutral-800 text-neutral-400 text-sm flex items-center justify-center gap-1.5">
              <Ban size={15} /> Discard
            </button>
            <button onClick={finishSession} className="flex-1 py-3 rounded-xl bg-amber-500 text-neutral-950 font-medium text-sm flex items-center justify-center gap-1.5">
              <Save size={15} /> Finish & save
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function SwapPanel({ exercises, currentExercise, onPick, onClose, getStats }) {
  const [query, setQuery] = useState("");
  const [allGroups, setAllGroups] = useState(false);
  const currentMuscleGroup = currentExercise.muscleGroup;
  const alternateIds = currentExercise.alternateIds || [];
  const matchesQuery = (e) => !query || e.name.toLowerCase().includes(query.toLowerCase());

  const pinned = exercises
    .filter((e) => !e.archived && alternateIds.includes(e.id) && matchesQuery(e))
    .sort((a, b) => alternateIds.indexOf(a.id) - alternateIds.indexOf(b.id));
  const pinnedIds = new Set(pinned.map((e) => e.id));
  const rest = sortExercises(
    exercises.filter((e) => {
      if (e.archived || pinnedIds.has(e.id)) return false;
      if (!allGroups && e.muscleGroup !== currentMuscleGroup) return false;
      if (!matchesQuery(e)) return false;
      return true;
    }),
    getStats
  );
  const filtered = [...pinned, ...rest];
  return (
    <div className="border-t border-neutral-800 pt-2 mt-1 space-y-2">
      <div className="flex items-center gap-2">
        <div className="relative flex-1">
          <Search size={13} className="absolute left-2 top-1/2 -translate-y-1/2 text-neutral-600" />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Search replacement"
            className="w-full bg-neutral-800 rounded-lg pl-7 pr-2 py-1.5 text-sm border border-neutral-700"
          />
        </div>
        <button onClick={() => setAllGroups((v) => !v)} className={`text-[11px] px-2 py-1.5 rounded-lg border ${allGroups ? "border-amber-500 text-amber-500" : "border-neutral-700 text-neutral-500"}`}>
          All groups
        </button>
        <button onClick={onClose} className="p-1.5 text-neutral-500">
          <X size={15} />
        </button>
      </div>
      <div className="max-h-48 overflow-y-auto space-y-1">
        {filtered.slice(0, 30).map((e) => (
          <button key={e.id} onClick={() => onPick(e.id)} className="w-full text-left px-2.5 py-1.5 rounded-lg bg-neutral-800 text-sm flex items-center justify-between gap-2">
            <span>
              {e.name}
              <span className="text-neutral-500 text-xs"> {e.machine ? `· ${e.machine}` : ""}</span>
            </span>
            {pinnedIds.has(e.id) ? <Badge tone="alt">Alternate</Badge> : e.suggested && <Badge tone="purple">Suggested</Badge>}
          </button>
        ))}
        {filtered.length === 0 && <p className="text-xs text-neutral-600 px-1">No matches.</p>}
      </div>
    </div>
  );
}

function AddExercisePicker({ exercises, onPick, label, getStats }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const filtered = sortExercises(
    exercises.filter((e) => !e.archived && e.name.toLowerCase().includes(query.toLowerCase())),
    getStats
  );
  return (
    <div className="relative">
      <button onClick={() => setOpen((v) => !v)} className="text-xs text-amber-500 flex items-center gap-1 border border-neutral-800 rounded-lg px-2 py-1.5">
        <Plus size={13} /> {label}
      </button>
      {open && (
        <div className="absolute right-0 mt-1 w-64 bg-neutral-900 border border-neutral-700 rounded-xl p-2 z-10 shadow-lg">
          <input
            autoFocus
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Search exercises"
            className="w-full bg-neutral-800 rounded-lg px-2 py-1.5 text-sm border border-neutral-700 mb-2"
          />
          <div className="max-h-56 overflow-y-auto space-y-1">
            {filtered.slice(0, 40).map((e) => (
              <button
                key={e.id}
                onClick={() => {
                  onPick(e.id);
                  setOpen(false);
                  setQuery("");
                }}
                className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-neutral-800 text-sm flex items-center justify-between gap-2"
              >
                <span>{e.name}</span>
                {e.suggested && <Badge tone="purple">Suggested</Badge>}
              </button>
            ))}
            {filtered.length === 0 && <p className="text-xs text-neutral-600 px-1 py-1">No matches.</p>}
          </div>
        </div>
      )}
    </div>
  );

    setCreating(false);

            <div key={g.group}>

function ProgramDetailView({ program, programs, setPrograms, exercises, exerciseById, onBack }) {
  const [addOpen, setAddOpen] = useState(false);
  const [query, setQuery] = useState("");
  if (!program) return null;

  const move = (idx, dir) => {
    const ids = [...program.exerciseIds];
    const j = idx + dir;
    if (j < 0 || j >= ids.length) return;
    [ids[idx], ids[j]] = [ids[j], ids[idx]];
    setPrograms(programs.map((p) => (p.id === program.id ? { ...p, exerciseIds: ids } : p)));
  };
  const removeEx = (eid) => {
    setPrograms(programs.map((p) => (p.id === program.id ? { ...p, exerciseIds: p.exerciseIds.filter((x) => x !== eid) } : p)));
  };
  const addEx = (eid) => {
    if (program.exerciseIds.includes(eid)) return;
    setPrograms(programs.map((p) => (p.id === program.id ? { ...p, exerciseIds: [...p.exerciseIds, eid] } : p)));
  };
  const archiveProgram = () => {
    setPrograms(programs.map((p) => (p.id === program.id ? { ...p, archived: true } : p)));
    onBack();
  };

  const filtered = exercises.filter((e) => !e.archived && !program.exerciseIds.includes(e.id) && e.name.toLowerCase().includes(query.toLowerCase()));

  return (
    <div className="px-4 py-4 space-y-3">
      <button onClick={onBack} className="text-xs text-neutral-500">
        Back to workouts
      </button>
      <div className="text-lg font-medium">{program.name}</div>
      <div className="space-y-1.5">
        {program.exerciseIds.map((eid, idx) => {
          const ex = exerciseById[eid];
          if (!ex) return null;
          return (
            <div key={eid} className="flex items-center gap-2 bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2">
              <div className="flex-1">
                <div className="text-sm">{ex.name}</div>
                <div className="text-xs text-neutral-500">{ex.machine}</div>
              </div>
              <button onClick={() => move(idx, -1)} className="text-neutral-500 p-1">
                <ChevronUp size={14} />
              </button>
              <button onClick={() => move(idx, 1)} className="text-neutral-500 p-1">
                <ChevronDown size={14} />
              </button>
              <button onClick={() => removeEx(eid)} className="text-neutral-500 p-1">
                <X size={14} />
              </button>
            </div>
          );
        })}
      </div>

      {addOpen ? (
        <div className="space-y-2 pt-2 border-t border-neutral-800">
          <input
            autoFocus
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Search exercises"
            className="w-full bg-neutral-900 rounded-lg px-3 py-2 text-sm border border-neutral-700"
          />
          <div className="max-h-48 overflow-y-auto space-y-1">
            {filtered.slice(0, 30).map((e) => (
              <button key={e.id} onClick={() => addEx(e.id)} className="w-full text-left px-2.5 py-1.5 rounded-lg bg-neutral-900 border border-neutral-800 text-sm">
                {e.name}
              </button>
            ))}
          </div>
          <button onClick={() => setAddOpen(false)} className="text-xs text-neutral-500">
            Done adding
          </button>
        </div>
      ) : (
        <button onClick={() => setAddOpen(true)} className="w-full py-2.5 rounded-xl border border-dashed border-neutral-700 text-amber-500 text-sm flex items-center justify-center gap-1.5">
          <Plus size={14} /> Add exercise
        </button>
      )}

      <button onClick={archiveProgram} className="w-full py-2.5 rounded-xl border border-red-900 text-red-400 text-sm mt-4">
        Archive this workout
      </button>
    </div>
  );
}

function ExerciseDetailView({ exercise, exercises, setExercises, history, getStats, logs, setLogs, programs, setPrograms, onBack }) {
  const [editing, setEditing] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [form, setForm] = useState(exercise ? { ...exercise } : {});
  const [quickLog, setQuickLog] = useState(false);
  const [qWeight, setQWeight] = useState("");
  const [qKind, setQKind] = useState("straight");
  const [qSplit, setQSplit] = useState(false);
  const [qLeft, setQLeft] = useState("");
  const [qRight, setQRight] = useState("");
  const [qNote, setQNote] = useState("");
  const [qReps, setQReps] = useState("");

  useEffect(() => {
    setForm(exercise ? { ...exercise } : {});
  }, [exercise]);

  if (!exercise) return null;
  const stats = getStats(exercise.id);

  const saveEdit = () => {
    setExercises(exercises.map((e) => (e.id === exercise.id ? { ...e, ...form } : e)));
    setEditing(false);
  };

  const archive = () => {
    setExercises(exercises.map((e) => (e.id === exercise.id ? { ...e, archived: true } : e)));
    onBack();
  };

  const deleteForever = () => {
    setExercises(
      exercises
        .filter((e) => e.id !== exercise.id)
        .map((e) => (e.alternateIds && e.alternateIds.includes(exercise.id) ? { ...e, alternateIds: e.alternateIds.filter((x) => x !== exercise.id) } : e))
    );
    setPrograms(programs.map((p) => (p.exerciseIds.includes(exercise.id) ? { ...p, exerciseIds: p.exerciseIds.filter((x) => x !== exercise.id) } : p)));
    onBack();
  };

  const saveQuickLog = () => {
    const hasNote = qNote.trim() !== "";
    if ((qSplit ? qLeft === "" && qRight === "" : !qWeight) && !hasNote) return;
    const log = {
      id: uid("log"),
      date: todayStr(),
      exerciseId: exercise.id,
      plannedExerciseId: null,
      programIds: [],
      sets:
        qSplit && (qLeft !== "" || qRight !== "")
          ? [{ split: true, left: qLeft, right: qRight, kind: qKind }]
          : qWeight
          ? [{ weight: parseFloat(qWeight), kind: qKind, reps: qReps }]
          : [],
      note: hasNote ? qNote.trim() : "",
      ts: Date.now(),
    };
    setLogs([...logs, log]);
    setQuickLog(false);
    setQWeight("");
    setQLeft("");
    setQRight("");
    setQNote("");
    setQReps("");
  };

  return (
    <div className="px-4 py-4 space-y-3">
      <button onClick={onBack} className="text-xs text-neutral-500">
        Back to library

      {editing ? (
        <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-3 space-y-2">
          <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full bg-neutral-800 rounded-lg px-2.5 py-2 text-sm border border-neutral-700" />
          <input value={form.machine} onChange={(e) => setForm({ ...form, machine: e.target.value })} placeholder="Machine / equipment" className="w-full bg-neutral-800 rounded-lg px-2.5 py-2 text-sm border border-neutral-700" />
          <div className="flex gap-2">
            {MUSCLE_GROUPS.map((g) => (
              <button key={g} onClick={() => setForm({ ...form, muscleGroup: g })} className={`flex-1 py-1.5 rounded-lg text-xs border ${form.muscleGroup === g ? "border-amber-500 text-amber-500" : "border-neutral-700 text-neutral-500"}`}>
                {g}
              </button>
            ))}
          </div>
          <div className="flex gap-2">
            <input value={form.defaultSets} onChange={(e) => setForm({ ...form, defaultSets: e.target.value })} placeholder="Sets" className="flex-1 bg-neutral-800 rounded-lg px-2.5 py-2 text-sm border border-neutral-700" />
            <input value={form.defaultReps} onChange={(e) => setForm({ ...form, defaultReps: e.target.value })} placeholder="Reps" className="flex-1 bg-neutral-800 rounded-lg px-2.5 py-2 text-sm border border-neutral-700" />
          </div>
          <textarea

            <button onClick={saveEdit} className="flex-1 py-2 rounded-lg bg-amber-500 text-neutral-950 text-sm font-medium">
              Save

          </div>
        </div>
      ) : (

      m[l.date].push(l);

  const [openDates, setOpenDates] = useState({});
  const toggle = (d) => setOpenDates((s) => ({ ...s, [d]: !s[d] }));

      date,
      entries: entries.filter((e) => !query || exerciseById[e.exerciseId]?.name.toLowerCase().includes(query.toLowerCase())),

          <div key={date} className="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden">

function WarmupBlock({ ex, entry, stats, updateEntry }) {
  const [open, setOpen] = useState(true);
  const defaultTarget = entry.warmupTarget !== undefined && entry.warmupTarget !== "" ? entry.warmupTarget : stats.prStraight ?? ex.warmupBase ?? "";
  const target = parseFloat(entry.warmupTarget !== undefined && entry.warmupTarget !== "" ? entry.warmupTarget : defaultTarget);
  const done = entry.warmupDone || [];

  const setTarget = (val) => updateEntry(entry.key, (e) => ({ ...e, warmupTarget: val }));
  const toggleDone = (i) => {
    const next = [...done];
    next[i] = !next[i];
    updateEntry(entry.key, (e) => ({ ...e, warmupDone: next }));
  };

  return (
    <div className="bg-sky-950/30 border border-sky-900/50 rounded-lg p-2.5 space-y-2">
      <button onClick={() => setOpen((v) => !v)} className="w-full flex items-center justify-between text-xs text-sky-400 font-medium">
        <span>Warm-up ramp</span>
        {open ? <ChevronUp size={14} /> : <ChevronDown size={14} />}
      </button>
      {open && (
        <>
          <div className="flex items-center gap-2">
            <span className="text-xs text-neutral-400">Today's target</span>
            <input
              type="number"
              inputMode="decimal"
              value={entry.warmupTarget !== undefined ? entry.warmupTarget : defaultTarget}
              onChange={(e) => setTarget(e.target.value)}
              className="w-20 bg-neutral-800 rounded-lg px-2 py-1 text-sm border border-neutral-700"
            />
          </div>
          <div className="space-y-1">
            {ex.warmupScheme.map((step, i) => {
              const w = isNaN(target) ? null : Math.round((target * step.pct) / 100 / 5) * 5;
              return (
                <button
                  key={i}
                  onClick={() => toggleDone(i)}
                  className={`w-full flex items-center justify-between text-xs px-2 py-1.5 rounded-lg ${
                    done[i] ? "bg-sky-900/40 text-sky-300 line-through" : "bg-neutral-800/60 text-neutral-300"
                  }`}
                >
                  <span className="flex items-center gap-1.5">
                    <span className={`w-3.5 h-3.5 rounded border ${done[i] ? "bg-sky-500 border-sky-500" : "border-neutral-600"} flex items-center justify-center shrink-0`}>
                      {done[i] && <Check size={10} className="text-neutral-950" />}
                    </span>
                    {step.reps} rep{step.reps > 1 ? "s" : ""} @ {step.pct}%{step.optional ? " (optional)" : ""}
                  </span>
                  <span className="font-medium">{w !== null ? w : "-"}</span>
                </button>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

const buildChartData = (history) => {
  const byDate = {};
  history.forEach((l) => {
    if (!byDate[l.date]) byDate[l.date] = { date: l.date, straight: null, ds: null };
    l.sets.forEach((s) => {
      repValues(s).forEach((w) => {
        const key = s.kind === "DS" ? "ds" : "straight";
        if (byDate[l.date][key] === null || w > byDate[l.date][key]) byDate[l.date][key] = w;
      });
    });
  });
  return Object.values(byDate).sort((a, b) => (a.date < b.date ? -1 : 1));
};

function DataSyncSection({ exercises, programs, logs, setExercises, setPrograms, setLogs }) {
  const fileInputRef = useRef(null);
  const [status, setStatus] = useState("");

  const doExport = async () => {
    setStatus("");
    const payload = {
      exportedAt: new Date().toISOString(),
      exercises,
      programs,
      logs,
    };
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
    const filename = `IronLedger_Backup_${stamp}.json`;
    try {
      const downloads = await (window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null));
      if (downloads) {
        const res = await downloads.save({ filename, data: JSON.stringify(payload, null, 2) });
        if (res) {
          setStatus("Saved to your phone.");
          return;
        }
      }
      setStatus("Download isn't available here. Try opening this page in your browser instead of the chat preview.");
    } catch (e) {
      setStatus("Couldn't save the file. Try again, or open this page in your browser.");
    }
  };

  const doImportClick = () => fileInputRef.current && fileInputRef.current.click();

  const doImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.exercises || !data.programs || !data.logs) {
          setStatus("That file doesn't look like an Iron Ledger backup.");
          return;
        }
        setExercises(data.exercises);
        setPrograms(data.programs);
        setLogs(data.logs);
        setStatus(`Imported backup from ${data.exportedAt ? formatDate(data.exportedAt.slice(0, 10)) : "file"}.`);
      } catch (err) {
        setStatus("Couldn't read that file — make sure it's an Iron Ledger backup JSON.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div className="pt-3 border-t border-neutral-800 space-y-2">
      <div className="text-[11px] text-neutral-500">Your data lives on this device only. Back it up or bring it to a chat with Claude anytime.</div>
      <div className="flex gap-2">
        <button onClick={doExport} className="flex-1 py-2 rounded-lg bg-neutral-900 border border-neutral-800 text-sm text-neutral-300">
          Export backup
        </button>
        <button onClick={doImportClick} className="flex-1 py-2 rounded-lg bg-neutral-900 border border-neutral-800 text-sm text-neutral-300">
          Import backup
        </button>
        <input ref={fileInputRef} type="file" accept="application/json" onChange={doImportFile} className="hidden" />
      </div>
      {status && <p className="text-xs text-teal-400">{status}</p>}
    </div>
  );
}

function SimpleLineChart({ data, hasStraight, hasDS }) {
  const W = 320;
  const H = 180;
  const padL = 32;
  const padR = 8;
  const padT = 8;
  const padB = 20;
  const allVals = [];
  data.forEach((d) => {
    if (d.straight !== null) allVals.push(d.straight);
    if (d.ds !== null) allVals.push(d.ds);
  });
  const minV = Math.min(...allVals);
  const maxV = Math.max(...allVals);
  const range = maxV - minV || 1;
  const x = (i) => padL + (i / (data.length - 1)) * (W - padL - padR);
  const y = (v) => padT + (1 - (v - minV) / range) * (H - padT - padB);

  const pathFor = (key) => {
    const pts = data.map((d, i) => (d[key] !== null ? [x(i), y(d[key])] : null)).filter(Boolean);
    if (pts.length < 2) return null;
    return pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  };

  const straightPath = hasStraight ? pathFor("straight") : null;
  const dsPath = hasDS ? pathFor("ds") : null;
  const step = Math.max(1, Math.ceil(data.length / 5));

  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H - 24}>
        <line x1={padL} y1={H - padB} x2={W - padR} y2={H - padB} stroke="#3f3f46" strokeWidth="1" />
        <line x1={padL} y1={padT} x2={padL} y2={H - padB} stroke="#3f3f46" strokeWidth="1" />
        <text x={2} y={y(maxV) + 3} fontSize="9" fill="#a3a3a3">
          {Math.round(maxV)}
        </text>
        <text x={2} y={y(minV) + 3} fontSize="9" fill="#a3a3a3">
          {Math.round(minV)}
        </text>
        {data.map((d, i) =>
          i % step === 0 ? (
            <text key={i} x={x(i)} y={H - 6} fontSize="8" fill="#a3a3a3" textAnchor="middle">
              {formatDate(d.date).split(" ").slice(0, 2).join(" ")}
            </text>
          ) : null
        )}
        {straightPath && <path d={straightPath} fill="none" stroke="#f59e0b" strokeWidth="2" />}
        {dsPath && <path d={dsPath} fill="none" stroke="#38bdf8" strokeWidth="2" />}
        {hasStraight &&
          data.map((d, i) => (d.straight !== null ? <circle key={"s" + i} cx={x(i)} cy={y(d.straight)} r="2.5" fill="#f59e0b" /> : null))}
        {hasDS && data.map((d, i) => (d.ds !== null ? <circle key={"d" + i} cx={x(i)} cy={y(d.ds)} r="2.5" fill="#38bdf8" /> : null))}
      </svg>
      <div className="flex gap-3 justify-center text-[10px] text-neutral-400 mt-1">
        {hasStraight && (
          <span className="flex items-center gap-1">
            <span className="w-2 h-2 rounded-full inline-block" style={{ background: "#f59e0b" }} /> Straight
          </span>
        )}
        {hasDS && (
          <span className="flex items-center gap-1">
            <span className="w-2 h-2 rounded-full inline-block" style={{ background: "#38bdf8" }} /> Dropset
          </span>
        )}
      </div>
    </div>
  );
}
